services:
  - type: web
    name: energenai-api
    runtime: python
    plan: free
    buildCommand: pip install -r energy-backend/requirements-lock.txt
    startCommand: cd energy-backend && python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
